info:
  name: 08 Listar Resultados del Juego
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/resultados?fecha={{fecha}}&juego_id={{juegoIdCazaloton}}&per_page=100"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Resultados persistidos
    - Por defecto consulta Cazalotón. Cambia `juego_id` a `{{juegoIdSelva}}` o
      `{{juegoIdChaima}}` para revisar el otro juego.
    - Para Selva, el resultado del comodín debe verse como:
      `numeros_ganadores = { comodin: "A", comodin_nombre: "Leoncito" }` (sin `nombre_animal`).
    - Para tripleta, cada sorteo debe tener su propio `hora_sorteo` y `nombre_animal`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
