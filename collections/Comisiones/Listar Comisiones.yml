info:
  name: Listar Comisiones
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/comisiones?per_page=15"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: per_page
      value: "15"
      type: query
  auth: inherit

docs:
  - |
    # Listar comisiones del ledger (paginado)
    - Roles: SM | M (master scoped: solo filas de `masterBancaIds`; sin bancas → lista vacía)
    - Autenticación: Sanctum (Bearer) — auth: inherit
    - `per_page` opcional (default 15); ordenadas por `id` descendente
    - Respuesta: paginator Laravel con relaciones `banca`, `grupo`, `taquilla`

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
