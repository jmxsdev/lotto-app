info:
  name: Ver Defaults
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/comisiones/defaults"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Default global de comisión por moneda
    - Roles: SM (solo super_master; 403 a otros roles)
    - Autenticación: Sanctum (Bearer) — auth: inherit
    - Respuesta: array de 2 filas (`bs`, `usd`) ordenadas por `moneda`:
      `{ "moneda", "porcentaje_pago" }` (`porcentaje_pago` nullable)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
