info:
  name: Crear Grupo
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/grupos"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Grupo Norte",
        "code": "GN001",
        "banca_id": 1,
        "user_name": "Admin Grupo Norte",
        "user_email": "grupo@test.com",
        "user_password": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
