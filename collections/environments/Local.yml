# NOTA: plantilla — NO rellenes credenciales reales aquí.
# Usa un archivo personal gitignored (Local.local.yml — ver collections/.gitignore).
name: Local
variables:
  - name: baseUrl
    value: http://localhost:8000
    enabled: true
    secret: false
    description: Backend Laravel local (php artisan serve)
  - name: token
    value: ""
    enabled: true
    secret: true
    description: Bearer token; se rellena al ejecutar Auth/Login (bru.setEnvVar)
  - name: macAddress
    value: d8:f3:bc:65:d1:c5
    enabled: true
    secret: false
    description: MAC de una taquilla activada en la BD local (debe coincidir con taquillas.mac_address; VerifyMac normaliza el header a MAYÚSCULAS y compara estricto)
  - name: deviceFingerprint
    value: ""
    enabled: true
    secret: false
    description: Huella del dispositivo (X-Device-Fingerprint); obligatoria para login y uso de taquilla
  - name: superEmail
    value: ""
    enabled: true
    secret: true
    description: Credencial de Auth/Login (rol super_master)
  - name: superPassword
    value: ""
    enabled: true
    secret: true
    description: Password de Auth/Login (rol super_master)
  - name: masterEmail
    value: ""
    enabled: true
    secret: true
    description: Credencial de Auth/Login (Master)
  - name: masterPassword
    value: ""
    enabled: true
    secret: true
    description: Password de Auth/Login (Master)
  - name: bancaEmail
    value: ""
    enabled: true
    secret: true
    description: Credencial de Auth/Login (Banca)
  - name: bancaPassword
    value: ""
    enabled: true
    secret: true
    description: Password de Auth/Login (Banca)
  - name: grupoEmail
    value: ""
    enabled: true
    secret: true
    description: Credencial de Auth/Login (Grupo)
  - name: grupoPassword
    value: ""
    enabled: true
    secret: true
    description: Password de Auth/Login (Grupo)
  - name: taquillaEmail
    value: ""
    enabled: true
    secret: true
    description: Credencial de Auth/Login (Taquilla)
  - name: taquillaPassword
    value: ""
    enabled: true
    secret: true
    description: Password de Auth/Login (Taquilla)
  - name: fecha
    value: ""
    enabled: true
    secret: false
    description: Fecha Y-m-d del test; la setea 01 Listar Juegos (America/Caracas)
  - name: juegoIdSelva
    value: ""
    enabled: true
    secret: false
    description: ID de selva-plus; lo setea 01 Listar Juegos
  - name: juegoIdCazaloton
    value: ""
    enabled: true
    secret: false
    description: ID de cazaloton; lo setea 01 Listar Juegos
  - name: juegoIdChaima
    value: ""
    enabled: true
    secret: false
    description: ID de loto-chaima; lo setea 01 Listar Juegos
  - name: ticketId
    value: ""
    enabled: true
    secret: false
    description: Ultimo ticket creado; lo setea 03/04/05
  - name: apuestaId
    value: ""
    enabled: true
    secret: false
    description: Ultima apuesta creada; la setea 03/04/05
