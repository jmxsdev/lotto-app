info:
  name: Servir Instalador
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/releases/serve?expires=1720000000&signature=..."
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Servir instalador (.exe por streaming)
    - Roles: público con URL firmada (la firma ES la credencial; sin auth Sanctum)
    - Autenticación: `signed:relative` + throttle `releases-download`
    - Requiere `expires` y `signature` válidos de la respuesta de `Descargar Instalador`
      (URL firmada, expira a los 5 min); 404 si la release o el archivo no existen
    - Respuesta: streaming `application/octet-stream` (`Taquilla-Setup-<version>.exe`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
