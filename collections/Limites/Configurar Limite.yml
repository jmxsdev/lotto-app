info:
  name: Configurar Limite
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/limites/1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "banca_id": 1,
        "moneda": "bs",
        "limite_minimo": 100,
        "limite_maximo": 5000,
        "porcentaje_pago": 80.00,
        "participacion": 5.00
      }
  auth: inherit

docs:
  - |
    # Configurar límite de un juego (upsert)
    - Roles (escritura): SM | M | B | G — el grupo escribe solo dentro de su subárbol
      (su grupo y sus taquillas, validado en el controlador); lectura SM | M | B | G | A
    - Autenticación: Sanctum (Bearer) — auth: inherit
    - `banca_id` es required (422 si falta); `grupo_id`/`taquilla_id` opcionales
    - Upsert por juego×banca×grupo×taquilla×moneda: 201 si crea, 200 si actualiza
    - Campos retirados del contrato: `fraccion` y `limite_tiempo` (ya no existen)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
