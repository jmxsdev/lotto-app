info:
  name: Configurar Limite (Batch)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/limites/batch"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "limites": [
          {
            "juego_id": 1,
            "banca_id": 1,
            "moneda": "bs",
            "limite_minimo": 100,
            "limite_maximo": 5000,
            "porcentaje_pago": 80.00,
            "participacion": 5.00
          },
          {
            "juego_id": 1,
            "banca_id": 1,
            "moneda": "usd",
            "limite_minimo": 1,
            "limite_maximo": 100,
            "porcentaje_pago": 80.00,
            "participacion": 5.00
          }
        ]
      }
  auth: inherit

docs:
  - |
    # Configuración masiva de límites (batch)
    - Roles (escritura): SM | M | B | G — el grupo escribe solo dentro de su subárbol
      (validado en el controlador); lectura SM | M | B | G | A
    - Autenticación: Sanctum (Bearer) — auth: inherit
    - Modo legacy (body de ejemplo): cada ítem lleva su `banca_id` (y opcional `grupo_id`/`taquilla_id`)
    - Modo scope (opt-in, ejemplo): `"scope": {"tipo": "bancas"}` aplica a TODAS las entidades
      visibles del tipo — los ítems NO deben incluir entidades (422 si las llevan); el tipo
      singular (`banca`/`grupo`/`taquilla`) exige `id` (422 si falta)
    - Guard: errores de validación se responden 422 (no 500)
    - Respuesta: 201 con array de límites actualizados (upsert atómico por transacción)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
