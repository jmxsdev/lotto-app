info:
  name: Get User (Token required)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/user"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Obtener usuario autenticado', () => {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody()).to.have.property('id');
            expect(res.getBody()).to.have.property('email');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
