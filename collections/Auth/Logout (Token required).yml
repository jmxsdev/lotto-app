info:
  name: Logout (Token required)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/logout"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Logout exitoso', () => {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody()).to.have.property('message');
        });

docs:
  - |
    # Cerrar sesión (revoca el token Sanctum)
    - Roles: todos los autenticados · Autenticación: Sanctum (Bearer) — auth: inherit
    - Fuera de verify.mac (no exige headers de dispositivo)
    - Respuesta: 200 con `{ "message": ... }`; el token deja de ser válido

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
