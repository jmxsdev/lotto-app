info:
  name: Login (Grupo)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Panel
      value: "true"
  body:
    type: json
    data: |-
      {
        "email": "{{grupoEmail}}",
        "password": "{{grupoPassword}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        if (res.getStatus() === 200 && response.token) {
            bru.setEnvVar('token', response.token);
            console.log('Token guardado en el entorno activo');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
