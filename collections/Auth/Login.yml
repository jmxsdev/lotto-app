info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Panel
      value: "true"
  body:
    type: json
    data: |-
      {
        "email": "{{superEmail}}",
        "password": "{{superPassword}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        if (res.getStatus() === 200 && response.token) {
            bru.setEnvVar('token', response.token);
            console.log('Token guardado en el entorno activo');
        }

        test('Login exitoso', () => {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody()).to.have.property('token');
        });

docs:
  - |
    # Login de panel (Super Master)
    - Roles: SM (super_master) · Autenticación: `auth: none` + X-Panel: "true" (panel)
    - Guarda `token` en el entorno activo con `bru.setEnvVar` (Bearer en el root)
    - Sin credenciales rellenas → 401 (vacío falla ruidoso, no autentica otro rol)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
