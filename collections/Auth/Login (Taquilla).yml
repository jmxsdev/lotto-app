info:
  name: Login (Taquilla)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{taquillaEmail}}",
        "password": "{{taquillaPassword}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        if (res.getStatus() === 200 && response.token) {
            bru.setEnvVar('token', response.token);
            console.log('Token guardado en el entorno activo');
        }

docs:
  - |
    # Login de taquilla (dispositivo)
    - Roles: T (taquilla) · Autenticación: `auth: none` SIN X-Panel (403 si lo envía)
    - X-Device-MAC/Fingerprint heredados del root (verify.mac); exige MAC registrada en BD
    - Guarda `token` en el entorno activo con `bru.setEnvVar` (Bearer en el root)
    - Sin credenciales rellenas → 401 (vacío falla ruidoso, no autentica otro rol)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
