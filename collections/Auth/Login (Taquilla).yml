info:
  name: Login (Taquilla)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{taquillaEmail}}",
        "password": "{{taquillaPassword}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        if (res.getStatus() === 200 && response.token) {
            bru.setEnvVar('token', response.token);
            console.log('Token guardado en el entorno activo');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
