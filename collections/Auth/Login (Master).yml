info:
  name: Login (Master)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Panel
      value: true
  body:
    type: json
    data: |-
      {
        "email": "master@lotto.com",
        "password": "password"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        if (res.getStatus() === 200 && response.token) {
            bru.setVar('token', response.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
