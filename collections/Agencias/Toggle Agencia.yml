info:
  name: Toggle Agencia
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/agencias/1/toggle"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Activar/desactivar agencia (toggle)
    - Roles: SM | M | B | G (agencia → 403: solo lectura de su local)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - Sin body; alterna `active` (true ↔ false)
    - Respuesta: 200 con la agencia actualizada

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
