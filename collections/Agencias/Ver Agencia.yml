info:
  name: Ver Agencia
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/agencias/1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Ver agencia por id
    - Roles: SM | M | B | G | A (agencia solo su propio local; fuera de alcance → 403)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - Respuesta: agencia con relación `grupo.banca`

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
