info:
  name: Actualizar Vencimiento
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/configuraciones/apuestas-vencimiento"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "horas": 24
      }
  auth: inherit

docs:
  - |
    # Actualizar ventana de vencimiento sin resultado
    - Roles: SM | M (403 a otros roles)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - `horas` required, entero 1..8760 (422 fuera de rango)
    - Respuesta: `{ "horas": N }` persistido (clave global `apuestas.vencimiento_sin_resultado`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
