info:
  name: Ver Vencimiento
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/configuraciones/apuestas-vencimiento"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Ver ventana de vencimiento sin resultado
    - Roles: SM | M (403 a otros roles)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - Respuesta: `{ "horas": N }` con fallback 24 si no hay valor persistido

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
