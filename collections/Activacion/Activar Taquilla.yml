info:
  name: Activar Taquilla
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/activar"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "activation_code": "ABCDE",
        "mac_address": "{{macAddress}}",
        "device_fingerprint": "{{deviceFingerprint}}"
      }

docs:
  - |
    # Activar taquilla con código + MAC (público, sin auth)
    - Roles: sin autenticación (endpoint público; throttle `10,60`)
    - `activation_code` required; `mac_address` required (regex MAC, se normaliza a MAYÚSCULAS);
      `device_fingerprint` required
    - MAC/Fingerprint se resuelven del entorno activo (`{{macAddress}}`/`{{deviceFingerprint}}`);
      la MAC debe estar registrada en `taquillas.mac_address` (activación o reactivación)
    - 404 si el código no existe; 403 si la taquilla ya está activa con otra MAC (anti-hijacking)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
