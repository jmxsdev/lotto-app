info:
  name: Reglas (Terminales)
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/v1/juegos/3/reglas"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Reglas del juego Terminales
    - Roles: SM | M | B | G | T | A (todos los autenticados)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - Respuesta: reglas del plugin + `modalidades` filtradas por `config.modalidades_permitidas`
      + `premios` del motor (estructura `{base, modalidades, comodines}` desde `config.premios`)
    - 404 si el juego no tiene plugin registrado

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
