info:
  name: Horarios (Terminales)
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/juegos/3/horarios"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: X-Device-MAC
      value: "{{macAddress}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
