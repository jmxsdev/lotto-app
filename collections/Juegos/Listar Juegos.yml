info:
  name: Listar Juegos
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/juegos"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: X-Device-MAC
      value: "{{macAddress}}"
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
