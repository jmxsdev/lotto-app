info:
  name: Reglas (Animalitos)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/juegos/1/reglas"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: X-Device-MAC
      value: "{{macAddress}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
