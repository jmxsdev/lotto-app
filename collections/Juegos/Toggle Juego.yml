info:
  name: Toggle Juego
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/juegos/1/toggle"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: '{"active": false}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
