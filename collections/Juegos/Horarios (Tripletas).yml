info:
  name: Horarios (Tripletas)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/juegos/2/horarios"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: X-Device-MAC
      value: "{{macAddress}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
