info:
  name: Registrar Pago (Token required)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/pagos"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: X-Device-MAC
      value: "{{macAddress}}"
  body:
    type: json
    data: |-
      {
        "apuesta_id": 1,
        "amount_bs": 300,
        "amount_usd": 300,
        "moneda": "mixto",
        "tipo": "egreso",
        "concepto": "Premio Animalitos"
      }
  auth: inherit

runtime:
  variables:
    - name: macAddress
      value: 00:1A:2B:3C:4D:5E

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
