info:
  name: Registrar Pago (Token required)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/pagos"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "apuesta_id": 1,
        "moneda": "bs",
        "tipo": "egreso",
        "concepto": "Premio Animalitos"
      }
  auth: inherit

docs:
  - |
    # Registrar pago de premio (egreso autoritativo)
    - Roles: SM | M | B | G | T (403 si rol taquilla paga una apuesta ajena)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - Estados pagables: `pendiente` | `ganadora` (422 cualquier otro estado)
    - Egreso SIN montos: el backend aplica el premio calculado por el MOTOR
      (`config.premios`) — la taquilla no calcula ni confirma montos. Con montos
      se valida ±0.01 contra el premio calculado (compatibilidad, 422 si difiere)
    - `tipo` ∈ ingreso|egreso|devolucion; `moneda` ∈ bs|usd|mixto;
      `metodo_pago` ∈ efectivo|transferencia|pago_movil|punto_venta (default efectivo)
    - 422 si el egreso no tiene resultado asignado o la apuesta no resultó ganadora
    - Respuesta: 201 con el pago creado

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
