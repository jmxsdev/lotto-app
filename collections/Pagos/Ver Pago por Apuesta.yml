info:
  name: Ver Pago por Apuesta
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/pagos/1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: X-Device-MAC
      value: "{{macAddress}}"
  auth: inherit

runtime:
  variables:
    - name: macAddress
      value: 00:1A:2B:3C:4D:5E

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
