info:
  name: Registrar Pago Triple Zulia
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/pagos"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "apuesta_id": 2,
        "amount_bs": 600,
        "amount_usd": 0,
        "moneda": "bs",
        "metodo_pago": "pago_movil",
        "tipo": "egreso",
        "concepto": "Premio Triple Zulia"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
