info:
  name: Verificar Dispositivo
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/dispositivo/verificar"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "device_fingerprint": "demo-device-001"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
