info:
  name: Listar Cierres (Token required)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cierre"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Listar cierres de caja
    - Roles: SM | M | B | G | T | A (alcance jerárquico: admin filtra por taquilla;
      rol taquilla solo su propia caja)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - Respuesta: array de cierres con `reclosed` (re-cierre del día) en cada fila

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
