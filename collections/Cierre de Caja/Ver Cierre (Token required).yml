info:
  name: Ver Cierre (Token required)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cierre/1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Ver detalle de un cierre
    - Roles: SM | M | B | G | T | A (403 si el cierre está fuera del alcance jerárquico)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - Respuesta: detalle del cierre con totales, desglose por método y `reclosed`
      (re-cierre: `fecha_fin` extendida, `reclosed_by`/`reclosed_at`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
