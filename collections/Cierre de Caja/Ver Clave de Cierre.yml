info:
  name: Ver Clave de Cierre
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/usuarios/clave-cierre"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Estado self-service de la clave de cierre (AD-9)
    - Roles: SM | M | B (otros roles → 403)
    - Autenticación: Sanctum (Bearer) — auth: inherit; SIN verify.mac (no exige headers de dispositivo)
    - Respuesta: `{ "clave_configurada": bool }` — solo el booleano, nunca el hash

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
