info:
  name: Reporte por Rango (Token required)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cierre/semanal?fecha_desde=2026-09-15&fecha_hasta=2026-09-21"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Reporte por rango (rollup de los cierres diarios, solo lectura)
    Rango arbitrario de días en America/Caracas. Parámetros de query:
    - `fecha_desde` + `fecha_hasta`: rango ad-hoc, ambos inclusivos a nivel de día.
      Son los parámetros PRIMARIOS y deben enviarse siempre los dos (422 si falta uno).
    - `fecha=YYYY-MM-DD` (opcional, aún aceptado): ancla la semana calendario
      lunes-domingo (default: hoy en Caracas). Mutuamente excluyente con
      `fecha_desde`/`fecha_hasta` (422 si se envían juntos).
    - `taquilla_id` (opcional): filtra una taquilla dentro del alcance del rol
      (403 si está fuera del alcance); el rol taquilla consulta solo su propia caja.
    ```json
    {
      "fecha_desde": "2026-09-15",
      "fecha_hasta": "2026-09-21",
      "ventana_cubierta": {
        "desde": "2026-09-15T23:59:59-04:00",
        "hasta": "2026-09-17T18:30:00-04:00",
        "cierres_incluidos": 1
      },
      "total_ventas_bs": 1500.00,
      "total_ventas_usd": 30.00,
      "total_ventas_bs_equivalent": 2595.00,
      "total_egresos_bs": 40.00,
      "total_egresos_usd": 3.00,
      "total_efectivo_bs": 1460.00,
      "total_efectivo_usd": 27.00,
      "arqueo_efectivo_bs": 1450.00,
      "arqueo_efectivo_usd": 30.00,
      "faltante_sobrante_bs": -10.00,
      "faltante_sobrante_usd": 3.00,
      "desglose_metodos": {
        "bs": {
          "efectivo": { "ventas": 1000.00, "egresos": 30.00, "efectivo": 970.00 },
          "transferencia": { "ventas": 300.00, "egresos": 10.00, "efectivo": 290.00 },
          "pago_movil": { "ventas": 150.00, "egresos": 0.00, "efectivo": 150.00 },
          "punto_venta": { "ventas": 50.00, "egresos": 0.00, "efectivo": 50.00 }
        },
        "usd": {
          "efectivo": { "ventas": 30.00, "egresos": 3.00, "efectivo": 27.00 }
        }
      },
      "cierres": [
        {
          "id": 12,
          "taquilla_id": 1,
          "fecha_inicio": "2026-09-17T08:00:00-04:00",
          "fecha_fin": "2026-09-17T18:30:00-04:00",
          "total_ventas_bs": "1500.00",
          "total_ventas_usd": "30.00",
          "total_ventas_bs_equivalent": "2595.00",
          "total_egresos_bs": "40.00",
          "total_egresos_usd": "3.00",
          "total_efectivo_bs": "1460.00",
          "total_efectivo_usd": "27.00",
          "arqueo_efectivo_bs": "1450.00",
          "arqueo_efectivo_usd": "30.00",
          "faltante_sobrante_bs": "-10.00",
          "faltante_sobrante_usd": "3.00",
          "desglose_metodos": {
            "bs": {
              "efectivo": { "ventas": 1000.00, "egresos": 30.00, "efectivo": 970.00 },
              "transferencia": { "ventas": 300.00, "egresos": 10.00, "efectivo": 290.00 },
              "pago_movil": { "ventas": 150.00, "egresos": 0.00, "efectivo": 150.00 },
              "punto_venta": { "ventas": 50.00, "egresos": 0.00, "efectivo": 50.00 }
            },
            "usd": {
              "efectivo": { "ventas": 30.00, "egresos": 3.00, "efectivo": 27.00 }
            }
          },
          "exchange_rate_cierre": "36.5000"
        }
      ]
    }
    ```
    `cierres[]` expone el shape completo de cada diario (desglose por método, arqueo y
    faltante/sobrante), ordenado por `fecha_fin` ascendente; los montos llegan como
    strings decimales. Rango sin diarios: totales en 0, arqueo/faltante en null,
    `ventana_cubierta` = {"desde": null, "hasta": null, "cierres_incluidos": 0} y `cierres: []`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5