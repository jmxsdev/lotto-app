info:
  name: Crear Cierre (Token required)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/cierre"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: X-Device-MAC
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "total_efectivo_bs": 10000,
        "total_efectivo_usd": 50
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
