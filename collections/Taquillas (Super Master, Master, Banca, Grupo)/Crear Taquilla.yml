info:
  name: Crear Taquilla
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/taquillas"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Taquilla 01",
        "code": "TT001",
        "grupo_id": 1,
        "user_name": "Admin Taquilla 01",
        "user_email": "taquilla@test.com",
        "user_password": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
