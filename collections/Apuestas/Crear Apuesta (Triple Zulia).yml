info:
  name: Crear Apuesta (Triple Zulia)
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/apuestas"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: X-Device-MAC
      value: "{{macAddress}}"
  body:
    type: json
    data: |-
      {
        "juego_id": 2,
        "combinacion": {
          "tipo": "triple_c",
          "numero": "123",
          "signo": "LEO"
        },
        "amount_bs": 3600,
        "amount_usd": 0
      }
  auth: inherit

runtime:
  variables:
    - name: macAddress
      value: 00:1A:2B:3C:4D:5E

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
