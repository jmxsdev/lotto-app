info:
  name: Crear Apuesta (Triple Zulia)
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/apuestas"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "juego_id": 2,
        "combinacion": {
          "tipo": "triple_c",
          "numero": "123",
          "signo": "LEO"
        },
        "amount_bs": 3600,
        "amount_usd": 0,
        "sorteo_hora": "2026-07-30 12:45:00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
