info:
  name: Listar Apuestas (Token required)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/apuestas?fecha=2026-07-10"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: fecha
      value: 2026-07-10
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
