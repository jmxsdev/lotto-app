info:
  name: Ver Apuesta
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/apuestas/2"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: X-Device-MAC
      value: "{{macAddress}}"
  params:
    - name: X-Device-MAC
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  variables:
    - name: macAddress
      value: 00:1A:2B:3C:4D:5E

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
