info:
  name: Crear Apuesta (Terminales)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/apuestas"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: X-Device-MAC
      value: "{{macAddress}}"
  body:
    type: json
    data: |-
      {
        "juego_id": 3,
        "combinacion": {"numero": "42"},
        "amount_bs": 3600,
        "amount_usd": 0,
        "sorteo_hora": "2026-07-30 14:00:00"
      }
  auth: inherit

runtime:
  variables:
    - name: macAddress
      value: 00:1A:2B:3C:4D:5E

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
