info:
  name: Crear Apuesta (Animalitos)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/apuestas"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "juego_id": 1,
        "combinacion": {"animal": "perro", "numero": 27},
        "amount_bs": 18000,
        "amount_usd": 50,
        "sorteo_hora": "2026-08-26 19:05:00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
