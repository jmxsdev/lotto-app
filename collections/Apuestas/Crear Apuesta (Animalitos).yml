info:
  name: Crear Apuesta (Animalitos)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/apuestas"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: X-Device-MAC
      value: "{{macAddress}}"
  body:
    type: json
    data: |-
      {
        "juego_id": 1,
        "combinacion": {"animal": "perro", "numero": 27},
        "amount_bs": 1800,
        "amount_usd": 50,
        "sorteo_hora": "2026-07-26 19:05:00"
      }
  auth: inherit

runtime:
  variables:
    - name: macAddress
      value: 00:1A:2B:3C:4D:5E

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
