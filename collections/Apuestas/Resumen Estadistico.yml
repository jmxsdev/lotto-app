info:
  name: Resumen Estadistico
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/apuestas/resumen"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: X-Device-MAC
      value: "{{macAddress}}"
  params:
    - name: X-Device-MAC
      value: "{{macAddress}}"
      type: query
      disabled: true
  auth: inherit

runtime:
  variables:
    - name: macAddress
      value: 00:1A:2B:3C:4D:5E

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
