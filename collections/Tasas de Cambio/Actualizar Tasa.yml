info:
  name: Actualizar Tasa
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/exchange-rates/1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "rate": 37.00,
        "notes": "Tasa actualizada manualmente"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
