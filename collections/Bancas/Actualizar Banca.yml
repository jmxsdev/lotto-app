info:
  name: Actualizar Banca
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/bancas/1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Banca Centro Actualizada",
        "active": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
