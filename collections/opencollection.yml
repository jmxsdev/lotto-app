opencollection: 1.0.0

info:
  name: LottoApp API - 1
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  variables:
    - name: baseUrl
      value: http://localhost:8000
    - name: token
      value: ""
    - name: macAddress
      value: d8:f3:bc:65:d1:c5
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
