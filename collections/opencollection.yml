opencollection: 1.0.0

info:
  name: LottoApp API - 1
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  headers:
    - name: X-Device-MAC
      value: "{{macAddress}}"
    - name: X-Device-Fingerprint
      value: "{{deviceFingerprint}}"
bundled: false
extensions:
  bruno:
    defaultEnvironment: Local
    ignore:
      - node_modules
      - .git
