info:
  name: Ganadores
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tickets/ganadores?fecha=2026-09-30"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Tickets ganadores por fecha
    - Roles: SM | M | B | G | T (sin agencia)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - `fecha` required (formato YYYY-MM-DD; 422 si falta)
    - Respuesta: `{ "data": [...], "message" }`; si no hay resultados para la fecha, `data` vacío

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
