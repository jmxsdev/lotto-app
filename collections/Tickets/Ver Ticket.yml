info:
  name: Ver Ticket
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tickets/1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

docs:
  - |
    # Ver ticket por id
    - Roles: SM | M | B | G | T (sin agencia; 403 si el ticket está fuera del alcance jerárquico)
    - Autenticación: Sanctum + verify.mac — auth: inherit
    - Respuesta: `{ "data": ticket }` con apuestas.juego, apuestas.detalles, taquilla y `tiene_ganadores`

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
