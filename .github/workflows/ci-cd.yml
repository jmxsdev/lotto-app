name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Tests y estilo
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: lotto_test
          MYSQL_USER: lotto_test
          MYSQL_PASSWORD: test_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:testkeyfortestingenvironment
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lotto_test
      DB_USERNAME: lotto_test
      DB_PASSWORD: test_secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, bcmath, zip, redis, pcntl, posix
          coverage: none

      - name: Instalar dependencias
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint (estilo)
        working-directory: backend
        run: vendor/bin/pint --test

      - name: PHPUnit
        working-directory: backend
        env:
          COLUMNS: 300
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --parallel --processes=4 --display-warnings --log-junit junit.xml
        # Suite completa ~35 min secuencial; paralela con 4 procesos (paratest)
        timeout-minutes: 60

      - name: Warnings de PHPUnit (junit)
        if: always()
        working-directory: backend
        run: grep -m4 -A1 "<warning" junit.xml || echo "sin warnings en junit"

  front-checks:
    name: Front — checks de iconografía y builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            taquilla/pnpm-lock.yaml
            panel/pnpm-lock.yaml

      - name: Instalar dependencias taquilla
        working-directory: taquilla
        run: pnpm install --frozen-lockfile

      - name: Instalar dependencias panel
        working-directory: panel
        run: pnpm install --frozen-lockfile

      - name: Checks de iconografía (pure + icons)
        run: |
          node taquilla/scripts/check-pure.mjs
          node taquilla/scripts/check-icons.mjs

      - name: Build taquilla
        working-directory: taquilla
        run: pnpm build

      - name: Build panel
        working-directory: panel
        run: pnpm build

  build:
    name: Build y push a GHCR
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        working-directory: backend
        run: |
          IMAGE=ghcr.io/jmxsdev/lotto-app-api
          SHA=${GITHUB_SHA:0:7}
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy al VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verificar secretos
        id: check
        env:
          HAS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$HAS_KEY" ]; then echo "present=yes" >> "$GITHUB_OUTPUT"; else echo "present=no" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy con healthcheck y rollback
        if: steps.check.outputs.present == 'yes'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          TARGET="$VPS_USER@$VPS_HOST"
          SSH_OPTS="-i ~/.ssh/ci_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"

          # Imagen actual (para rollback)
          PREV=$(ssh $SSH_OPTS "$TARGET" "docker inspect lotto_api_prod --format '{{.Image}}'" || true)

          ssh $SSH_OPTS "$TARGET" "cd $VPS_PATH && git pull && docker compose --env-file .env.production -f docker-compose.prod.yml pull --quiet && docker compose --env-file .env.production -f docker-compose.prod.yml up -d"

          ok=1
          for _ in $(seq 1 36); do
            code=$(ssh $SSH_OPTS "$TARGET" "curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:10000/api/v1/juegos" || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then ok=0; break; fi
            sleep 5
          done

          if [ "$ok" -ne 0 ]; then
            if [ -n "$PREV" ]; then
              ssh $SSH_OPTS "$TARGET" "docker tag $PREV ghcr.io/jmxsdev/lotto-app-api:rollback && cd $VPS_PATH && IMAGE_TAG=rollback docker compose --env-file .env.production -f docker-compose.prod.yml up -d" || true
            fi
            echo "healthcheck falló; rollback aplicado"
            exit 1
          fi

          # REQ-6: el volumen del instalador debe montarse en la ruta real y ser consistente.
          DEST=$(ssh $SSH_OPTS "$TARGET" "docker inspect lotto_api_prod --format '{{range .Mounts}}{{if eq .Destination \"/app/storage/app/releases\"}}{{.Destination}}{{end}}{{end}}'" || true)
          if [ "$DEST" != "/app/storage/app/releases" ]; then
            echo "FALLO: taquilla_releases no está montado en /app/storage/app/releases"
            exit 1
          fi
          CODE=$(ssh $SSH_OPTS "$TARGET" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/api/v1/update-check" || true)
          if [ "$CODE" = "200" ]; then
            EXP=$(ssh $SSH_OPTS "$TARGET" "curl -s http://127.0.0.1:10000/api/v1/update-check" | sed -n 's/.*\"sha256\":\"\([a-f0-9]\{64\}\)\".*/\1/p')
            ACT=$(ssh $SSH_OPTS "$TARGET" "docker exec lotto_api_prod sh -c 'sha256sum /app/storage/app/releases/*.exe 2>/dev/null'" | awk '{print $1}' | head -1 || true)
            if [ -n "$EXP" ] && [ "$EXP" != "$ACT" ]; then
              echo "FALLO: sha256 del instalador no coincide (update-check=$EXP, archivo=$ACT)"
              exit 1
            fi
          fi
          echo "deploy OK"
